# ============================================================
# P2D 全局参数敏感性分析平台 · 配置
# ============================================================

model:
  name: DFN
  thermal: lumped
  parameter_set: Chen2020

# 参数扰动：统一乘法区间（相对基线），参数在归一化 [0,1] 抽样后线性映射
perturbation:
  lower_factor: 0.8
  upper_factor: 1.2

# 3 个基准工况
scenarios:
  s1_discharge_1c:
    experiment: "Discharge at 1C until 2.5 V"
    outputs:
      capacity_ah: "Discharge capacity [A.h]"
      time_to_cutoff_s: "Time [s]"
    aggregations:
      capacity_ah: last
      time_to_cutoff_s: last
  s2_fastcharge_2c:
    experiment: "Charge at 2C for 2400 seconds"
    outputs:
      max_temperature_c: "X-averaged cell temperature [C]"
    aggregations:
      max_temperature_c: max
  s3_cold_charge:
    # ambient_t 在统一参数空间中扰动（238-358K），低温析锂物理由冒烟测试验证
    experiment: "Charge at 0.5C for 1800 seconds"
    outputs:
      min_neg_phi_v: "X-averaged negative electrode surface potential difference [V]"
    aggregations:
      min_neg_phi_v: min

# Morris 筛选
morris:
  num_levels: 4
  num_trajectories: 60        # 抽样轨迹数（实际样本 = trajectories*(d+1)）
  optimal_trajectories: 20

# Sobol 方差分解（calc_second_order=false 时样本数 = N*(d+2)）
sobol:
  base_n: 256              # 2^8，保证 Sobol 低差异序列收敛性质
  calc_second_order: false

# 二阶 S2 专用设计（calc_second_order=true，样本数 = N*(2d+2)）
sobol_s2:
  base_n: 128              # 2^7
  calc_second_order: true

# 统计与不确定性
statistics:
  bootstrap_n: 1000
  confidence: 0.95
  whitelist_st_threshold: 0.05   # ST<5% 列入不敏感白名单
  convergence_subsets: 4

# 运行
runtime:
  n_workers: 4
  checkpoint_dir: "results/samples"
  solver_tolerance: 1.0e-6
  max_eval_time_s: 120
