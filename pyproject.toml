[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybamm-p2d-gsa"
version = "1.0.0"
description = "Global parameter sensitivity analysis (Morris + Sobol) for a PyBaMM P2D/DFN model, no deep learning"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ilo-love7" }]
keywords = [
    "pybamm", "P2D", "DFN", "sensitivity analysis", "Morris", "Sobol",
    "SALib", "global sensitivity", "battery modeling",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "SALib>=1.4.5",
    "pybamm>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/ilo-love7/pybamm-p2d-gsa"
Repository = "https://github.com/ilo-love7/pybamm-p2d-gsa"
Issues = "https://github.com/ilo-love7/pybamm-p2d-gsa/issues"

[project.scripts]
p2d-gsa = "p2d_gsa.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
p2d_gsa = ["resources/gsa_config.yaml"]

# ===================== Ruff =====================
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

# ===================== Pytest =====================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
